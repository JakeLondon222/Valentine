<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Will you be my Valentine, Emille? 💘</title>
  <style>
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
      background: linear-gradient(135deg, #ffeff7, #ffe3ee);
      min-height:100vh;
      display:grid;
      place-items:center;
      text-align:center;
    }

    .card{
      background:white;
      padding:24px;
      border-radius:22px;
      box-shadow:0 12px 40px rgba(0,0,0,.12);
      width:min(640px, 90vw);
    }

    h1{
      margin:0 0 12px;
      font-size:32px;
    }

    img{
      width:100%;
      max-height:360px;
      object-fit:contain;
      border-radius:18px;
      margin:14px 0;
    }

    .yes{
      background:linear-gradient(135deg, #ff4d88, #ff2e6f);
      color:white;
      border:0;
      padding:16px 22px;
      border-radius:16px;
      font-size:18px;
      font-weight:700;
      cursor:pointer;
      box-shadow:0 12px 28px rgba(255,46,111,.30);
    }

    .confetti{
      position:fixed;
      inset:0;
      pointer-events:none;
      display:none;
    }
    .confetti.show{display:block}
    .confetti span{
      position:absolute;
      width:10px;
      height:16px;
      border-radius:4px;
      animation: fall 1.2s linear forwards;
    }
    @keyframes fall{
      to{transform:translateY(110vh) rotate(360deg)}
    }

    .message{
      display:none;
      font-size:20px;
      margin-top:16px;
      color:#d6004f;
      font-weight:700;
    }
  </style>
</head>

<body>

<div class="card">
  <h1>Will you be my Valentine, Emille? 💖</h1>

  <!-- YOUR GIF -->
  <img src="cute-cat-love.gif" alt="Cute cat with heart GIF" />

  <button class="yes" id="yesBtn">YES 💘</button>

  <div class="message" id="msg">
    WELL DONE EMILLE!! You are fucking AWESEOME 🥹💞
  </div>
</div>

<div class="confetti" id="confetti"></div>

<script>
const yesBtn = document.getElementById("yesBtn");
const msg = document.getElementById("msg");
const confetti = document.getElementById("confetti");

function popConfetti(){
  confetti.innerHTML = "";
  confetti.classList.add("show");

  for(let i=0;i<120;i++){
    const s = document.createElement("span");
    const colors = ["#ff4d88","#ff2e6f","#ffd166","#a78bfa","#34d399"];
    s.style.background = colors[Math.floor(Math.random()*colors.length)];
    s.style.left = Math.random()*100 + "vw";
    s.style.top = "-10vh";
    s.style.animationDuration = (1 + Math.random()).toFixed(2) + "s";
    confetti.appendChild(s);
  }

  setTimeout(()=>confetti.classList.remove("show"),1500);
}

yesBtn.addEventListener("click", ()=>{
  popConfetti();
  msg.style.display = "block";
  yesBtn.textContent = "JAKE WINS 💕";
  yesBtn.disabled = true;
});
</script>

</body>
</html>
